<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F5F7FC; --ink:#131A2B; --muted:#5B6478; --accent:#5B7CFA; --accent-d:#3A52D8;
    --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
  .box{max-width:520px}
  .mark{width:46px;height:46px;border-radius:11px;background:var(--accent);position:relative;margin:0 auto 26px;display:block}
  .mark::before{content:"";position:absolute;inset:9px;border-radius:4px;
    background:radial-gradient(circle at 30% 30%, #fff 0 3px, transparent 3px),
               radial-gradient(circle at 70% 30%, #fff 0 3px, transparent 3px),
               radial-gradient(circle at 30% 70%, #fff 0 3px, transparent 3px),
               radial-gradient(circle at 70% 70%, #fff 0 3px, transparent 3px),
               radial-gradient(circle at 50% 50%, #fff 0 3.4px, transparent 3.4px)}
  .code{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,6vw,44px);letter-spacing:-.025em;margin:12px 0 0}
  p{color:var(--muted);font-size:17px;margin:16px 0 0}
  a.btn{display:inline-flex;align-items:center;gap:8px;margin-top:30px;font-weight:600;font-size:15px;padding:13px 24px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;transition:.18s}
  a.btn:hover{background:var(--accent-d)}
</style>
</head>
<body>
  <div class="box">
    <span class="mark" aria-hidden="true"></span>
    <div class="code">// 404</div>
    <h1>This node is off the grid</h1>
    <p>That page isn't in the network. Let us route you back to the start.</p>
    <a class="btn" href="/">Back to List Canopy →</a>
  </div>
</body>
</html>
